<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stránka nenalezena | InnerVisio</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050308" />
    <link rel="icon" type="image/png" href="/FavIcon.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(60% 50% at 50% 30%, rgba(140, 50, 150, 0.35) 0%, transparent 70%), #050308;
        color: #F1E6F2;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 480px; }
      img { width: 72px; height: 72px; margin-bottom: 28px; }
      .code { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #C48BE0; margin: 0 0 12px; }
      h1 { font-family: 'Poppins', system-ui, sans-serif; font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.02em; margin: 0 0 16px; }
      p { color: #C4B2C8; line-height: 1.6; margin: 0 0 32px; }
      a.btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: #A24DB8;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 30px rgba(162, 77, 184, 0.35);
      }
      a.btn:focus-visible { outline: 2px solid #C48BE0; outline-offset: 3px; }
      .contact { margin-top: 28px; font-size: 14px; }
      .contact a { color: #C48BE0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/FavIcon.png" alt="InnerVisio" width="72" height="72" />
      <p class="code">Chyba 404</p>
      <h1>Tuhle stránku jsme nenašli</h1>
      <p>Odkaz je možná zastaralý. Na hlavní stránce najdete naše vizualizace, ceník i kontakt.</p>
      <a class="btn" href="/">Zpět na InnerVisio</a>
      <p class="contact">Nebo nám napište na <a href="mailto:innervisio@gmail.com">innervisio@gmail.com</a></p>
    </main>
  </body>
</html>
